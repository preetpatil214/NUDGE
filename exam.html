<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#111426" />
  <title>Exam details | Nudge</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="/nudge-icon-192.png" />
  <link rel="apple-touch-icon" href="/nudge-icon-192.png" />
  <script defer src="/_vercel/insights/script.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100dvh; color: #fff; font-family: Inter, Arial, sans-serif;
      background: linear-gradient(rgba(6, 8, 20, .62), rgba(6, 8, 20, .38)), url("bg.jpg") center / cover fixed;
    }
    .detail-page {
      width: min(100%, 500px); min-height: 100dvh; margin: auto;
      padding: max(22px, env(safe-area-inset-top)) 20px max(30px, env(safe-area-inset-bottom));
    }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
    .brand img { display: block; width: 150px; height: auto; }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px;
      border: 1px solid rgba(255,255,255,.24); border-radius: 999px;
      background: rgba(8,10,23,.28); color: rgba(255,255,255,.86); font-size: 13px;
      font-weight: 700; text-decoration: none; box-shadow: inset 0 1px rgba(255,255,255,.1);
      transition: color 160ms ease, transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }
    .back-link::before { content: "←"; color: #c9c1ff; font-size: 16px; line-height: 1; }
    .back-link:hover, .back-link:focus-visible { border-color: rgba(185,173,255,.62); background: rgba(144,113,255,.18); color: #fff; transform: translateX(-2px); }
    .page-title {
      margin: 0 0 7px; font-size: clamp(24px, 6vw, 32px); line-height: 1.1;
      background: linear-gradient(110deg, #f09ac8, #b9adff 52%, #a9d9e8);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .summary { margin: 0 0 20px; color: rgba(255,255,255,.72); font-size: 14px; }
    .progress-status { margin: 0 0 20px; }
    .progress-label { display: flex; justify-content: space-between; margin-bottom: 7px; color: rgba(255,255,255,.76); font-size: 12px; }
    .progress-track { height: 7px; overflow: hidden; border-radius: 999px; background: rgba(255,255,255,.14); }
    .progress-fill { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(110deg, #ea4897, #9071ff 52%, #3db9de); transition: width 180ms ease; }
    .subject-list { display: grid; gap: 14px; }
      .manage-exam-button {
        display: inline-flex; margin: 0 0 20px; padding: 9px 14px; border: 1px solid rgba(255,255,255,.24);
        border-radius: 999px; background: linear-gradient(110deg, rgba(234,72,151,.28), rgba(144,113,255,.22) 48%, rgba(61,185,222,.28));
        color: rgba(255,255,255,.9); font-size: 12px; font-weight: 700; text-decoration: none;
        box-shadow: 0 6px 16px rgba(7,5,22,.18), inset 0 1px rgba(255,255,255,.12);
        transition: transform 160ms ease, filter 160ms ease;
      }
      .manage-exam-button:hover, .manage-exam-button:focus-visible { transform: translateY(-2px); filter: brightness(1.12); }
      .remove-exam-button {
        display: inline-flex; margin: 0 0 20px 6px; padding: 9px 14px; border: 1px solid rgba(255,130,170,.28);
        border-radius: 999px; background: rgba(110,32,75,.2); color: rgba(255,190,210,.9);
        cursor: pointer; font: inherit; font-size: 12px; font-weight: 700;
        transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
      }
      .remove-exam-button:hover, .remove-exam-button:focus-visible { transform: translateY(-2px); border-color: rgba(255,130,170,.58); background: rgba(150,45,90,.3); }
    .subject-card {
      position: relative; isolation: isolate; padding: 17px; border: 1px solid rgba(255,255,255,.22); border-radius: 22px;
      background: transparent; box-shadow: 0 8px 20px rgba(7,5,22,.2), inset 0 1px rgba(255,255,255,.1);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    }
    .subject-card::before {
      content: ""; position: absolute; z-index: -1; inset: 9px -7px -9px; border-radius: inherit;
      background: linear-gradient(110deg, rgba(234,72,151,.34), rgba(144,113,255,.24) 48%, rgba(61,185,222,.32));
      filter: blur(18px); opacity: .78;
    }
    .subject-card h2 { margin: 0 0 12px; font-size: 19px; }
    .subject-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .subject-heading h2 { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .remove-subject-button, .remove-chapter-button {
      flex: 0 0 auto; border: 0; background: transparent; color: rgba(255,190,210,.72); cursor: pointer;
      font: inherit; font-weight: 700; transition: color 160ms ease, transform 160ms ease;
    }
    .remove-subject-button { padding: 3px 0; font-size: 12px; }
    .remove-chapter-button { padding: 0 0 0 4px; font-size: 15px; line-height: 1; }
    .remove-subject-button:hover, .remove-subject-button:focus-visible, .remove-chapter-button:hover, .remove-chapter-button:focus-visible { color: #ffd4e1; transform: scale(1.08); }
    .chapter-list { display: grid; gap: 8px; }
    .chapter-item {
      display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 12px;
      background: rgba(8,10,23,.3); color: rgba(255,255,255,.86); font-size: 14px;
      transition: background 160ms ease, color 160ms ease;
    }
    .chapter-info { display: grid; flex: 1 1 auto; gap: 5px; min-width: 0; }
    .chapter-item .chapter-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chapter-notes { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
    .chapter-note-badge { display: inline-flex; align-items: center; gap: 5px; max-width: 155px; padding: 4px 6px 4px 8px; border: 1px solid rgba(169,217,232,.3); border-radius: 6px; background: linear-gradient(110deg, rgba(234,72,151,.14), rgba(144,113,255,.18) 52%, rgba(61,185,222,.14)); color: rgba(232,246,255,.88); font-size: 10px; font-weight: 700; letter-spacing: .01em; line-height: 1.1; }
    .chapter-note-badge::before { content: ""; flex: 0 0 5px; width: 5px; height: 5px; border-radius: 50%; background: #a9d9e8; box-shadow: 0 0 7px rgba(169,217,232,.8); }
    .clear-note-button { padding: 0; border: 0; background: transparent; color: rgba(225,249,255,.58); cursor: pointer; font: inherit; font-size: 12px; line-height: 1; }
    .clear-note-button:hover, .clear-note-button:focus-visible { color: #fff; }
    .add-note-button { flex: 0 0 auto; padding: 5px 7px; border: 1px solid rgba(201,193,255,.34); border-radius: 7px; background: rgba(144,113,255,.14); color: rgba(231,226,255,.9); cursor: pointer; font: inherit; font-size: 10px; font-weight: 700; }
    .add-note-button:hover, .add-note-button:focus-visible { border-color: rgba(201,193,255,.72); background: rgba(144,113,255,.28); }
    .chapter-item input {
      appearance: none; flex: 0 0 19px; width: 19px; height: 19px; margin: 0;
      border: 1px solid rgba(255,255,255,.5); border-radius: 6px; background: rgba(255,255,255,.08);
      cursor: pointer; transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
    }
    .chapter-item input:hover { border-color: #c9c1ff; transform: scale(1.06); }
    .chapter-item input:checked { border-color: transparent; background: linear-gradient(135deg, #ea4897, #9071ff 55%, #3db9de); }
    .chapter-item input:checked::after { content: "✓"; display: block; color: #fff; font-size: 13px; font-weight: 800; line-height: 17px; text-align: center; }
    .chapter-item:has(input:checked) { background: rgba(144,113,255,.16); color: rgba(255,255,255,.64); }
    .empty-state { margin: 0; color: rgba(255,255,255,.68); font-size: 14px; }
    .missing-state { padding-top: 30px; text-align: center; }
    .note-modal-backdrop { position: fixed; z-index: 10; inset: 0; display: grid; place-items: center; padding: 20px; background: rgba(5,7,18,.68); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    .note-modal { position: relative; width: min(100%, 470px); max-height: min(640px, 90dvh); overflow: auto; scrollbar-width: none; padding: 24px; border: 1px solid rgba(201,193,255,.34); border-radius: 22px; background: linear-gradient(145deg, rgba(27,22,55,.97), rgba(14,25,49,.97)); box-shadow: 0 24px 70px rgba(4,3,18,.58), 0 0 34px rgba(144,113,255,.16), inset 0 1px rgba(255,255,255,.14); }
    .note-modal::-webkit-scrollbar { display: none; }
    .note-modal::before { content: ""; position: absolute; top: 0; left: 24px; right: 24px; height: 2px; border-radius: 999px; background: linear-gradient(90deg, #ea4897, #9071ff 52%, #3db9de); opacity: .9; }
    .note-modal-kicker { margin: 0 0 6px; color: #a9d9e8; font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .note-modal h2 { margin: 0; overflow: hidden; background: linear-gradient(110deg, #f09ac8, #c9c1ff 54%, #a9d9e8); -webkit-background-clip: text; background-clip: text; color: transparent; text-overflow: ellipsis; white-space: nowrap; font-size: 23px; line-height: 1.15; }
    .note-modal-hint { margin: 7px 0 18px; color: rgba(255,255,255,.62); font-size: 12px; }
    .note-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
    .note-option { display: flex; align-items: center; gap: 8px; min-height: 42px; padding: 8px 9px; border: 1px solid rgba(255,255,255,.08); border-radius: 10px; background: rgba(255,255,255,.055); color: rgba(255,255,255,.82); cursor: pointer; font-size: 12px; line-height: 1.2; transition: border-color 160ms ease, background 160ms ease, color 160ms ease, transform 160ms ease; }
    .note-option:hover { border-color: rgba(201,193,255,.38); background: rgba(144,113,255,.13); transform: translateY(-1px); }
    .note-option:has(input:checked) { border-color: rgba(169,217,232,.42); background: linear-gradient(110deg, rgba(234,72,151,.2), rgba(144,113,255,.24) 52%, rgba(61,185,222,.18)); color: #fff; }
    .note-option input { appearance: none; flex: 0 0 17px; width: 17px; height: 17px; margin: 0; border: 1px solid rgba(255,255,255,.42); border-radius: 5px; background: rgba(8,10,23,.3); cursor: pointer; }
    .note-option input:checked { border-color: transparent; background: linear-gradient(135deg, #ea4897, #9071ff 55%, #3db9de); }
    .note-option input:checked::after { content: "✓"; display: block; color: #fff; font-size: 12px; font-weight: 800; line-height: 16px; text-align: center; }
    .note-modal-message { min-height: 18px; margin: 11px 0 0; color: #ffc1d4; font-size: 11px; }
    .note-modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 11px; padding-top: 13px; border-top: 1px solid rgba(255,255,255,.1); }
    .note-modal-actions button { padding: 8px 13px; border: 1px solid rgba(255,255,255,.2); border-radius: 9px; background: rgba(255,255,255,.07); color: rgba(255,255,255,.78); cursor: pointer; font: inherit; font-size: 12px; font-weight: 700; transition: filter 160ms ease, transform 160ms ease, border-color 160ms ease; }
    .note-modal-actions .note-modal-save { border-color: rgba(201,193,255,.5); background: linear-gradient(110deg, rgba(234,72,151,.65), rgba(144,113,255,.72) 52%, rgba(61,185,222,.62)); color: #fff; box-shadow: 0 5px 14px rgba(80,54,160,.22); }
    .note-modal-actions button:hover, .note-modal-actions button:focus-visible { border-color: rgba(255,255,255,.48); filter: brightness(1.12); transform: translateY(-1px); }
    body:has(.note-modal-backdrop) { overflow: hidden; }
    @media (max-width: 460px) { .note-modal { padding: 21px; } .note-options { grid-template-columns: 1fr; } }
    @media (max-width: 412px) {
      .detail-page { padding-inline: 18px; }
      .brand img { width: 142px; }
      .subject-card { padding: 16px; }
    }
  </style>
</head>
<body>
  <main class="detail-page">
    <header class="topbar">
      <a class="brand" href="main.html" aria-label="Nudge home"><img src="nudge-logo.svg" alt="Nudge" /></a>
      <a class="back-link" href="main.html">Back</a>
    </header>
    <section id="exam-detail" aria-live="polite"></section>
  </main>
  <script>
    const legacyKey = "nudge-study-plan";
    const plansKey = "nudge-study-plans";
    const detail = document.getElementById("exam-detail");

    function getPlans() {
      try {
        const savedPlans = JSON.parse(localStorage.getItem(plansKey) || "[]");
        if (Array.isArray(savedPlans) && savedPlans.length) return savedPlans;
        const legacyPlan = JSON.parse(localStorage.getItem(legacyKey) || "null");
        return legacyPlan ? [legacyPlan] : [];
      } catch (error) {
        return [];
      }
    }

    const examIndex = Number.parseInt(new URLSearchParams(window.location.search).get("exam"), 10);
    const plans = getPlans();
    const plan = plans[examIndex];

    function savePlans() {
      localStorage.setItem(plansKey, JSON.stringify(plans));
      localStorage.removeItem(legacyKey);
    }

    const noteOptions = [
      "Completed in Class", "Completed in School", "Self-Study Pending",
      "Notes Written & Ready", "Formula Sheet Needed", "Questions Pending",
      "Important for Exam", "Needs Revision", "Doubts to Clear",
      "PYQs Solved", "First Read Done"
    ];

    function normalizeChapter(chapter) {
      if (typeof chapter === "string") return { name: chapter, notes: [] };
      return {
        name: chapter?.name || "Untitled chapter",
        notes: Array.isArray(chapter?.notes) ? chapter.notes.filter((note) => noteOptions.includes(note)).slice(0, 3) : []
      };
    }

    function showNoteModal(chapter) {
      const backdrop = document.createElement("div");
      backdrop.className = "note-modal-backdrop";
      backdrop.innerHTML = `
        <section class="note-modal" role="dialog" aria-modal="true" aria-labelledby="note-modal-title">
          <p class="note-modal-kicker">Chapter status</p>
          <h2 id="note-modal-title"></h2>
          <p class="note-modal-hint">Add up to 3 short status tags.</p>
          <div class="note-options"></div>
          <p class="note-modal-message" role="status"></p>
          <div class="note-modal-actions">
            <button class="note-modal-save" type="button">Save tags</button>
          </div>
        </section>
      `;
      const title = backdrop.querySelector("#note-modal-title");
      const options = backdrop.querySelector(".note-options");
      const message = backdrop.querySelector(".note-modal-message");
      const saveButton = backdrop.querySelector(".note-modal-save");
      const selectedNotes = new Set(chapter.notes);
      title.textContent = chapter.name;

      noteOptions.forEach((note) => {
        const label = document.createElement("label");
        label.className = "note-option";
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.value = note;
        checkbox.checked = selectedNotes.has(note);
        checkbox.addEventListener("change", () => {
          if (checkbox.checked && selectedNotes.size >= 3) {
            checkbox.checked = false;
            message.textContent = "Choose up to 3 tags per chapter.";
            return;
          }
          if (checkbox.checked) selectedNotes.add(note);
          else selectedNotes.delete(note);
          message.textContent = "";
        });
        label.append(checkbox, document.createTextNode(note));
        options.appendChild(label);
      });

      saveButton.addEventListener("click", () => {
        if (!selectedNotes.size) {
          message.textContent = "Select at least 1 tag, or remove tags from the chapter line.";
          return;
        }
        chapter.notes = [...selectedNotes];
        savePlans();
        backdrop.remove();
        window.location.reload();
      });
      backdrop.addEventListener("click", (event) => {
        if (event.target === backdrop) backdrop.remove();
      });
      document.body.appendChild(backdrop);
      options.querySelector("input")?.focus();
    }

    if (!plan) {
      detail.className = "missing-state";
      detail.innerHTML = '<p class="empty-state">That exam could not be found.</p>';
    } else {
      const title = document.createElement("h1");
      title.className = "page-title";
      title.textContent = plan.examName || "Untitled exam";
      detail.appendChild(title);

      const subjects = Array.isArray(plan.subjects) ? plan.subjects : [];
      const chapterCount = subjects.reduce((total, subject) => total + (Array.isArray(subject.chapters) ? subject.chapters.length : 0), 0);
      const summary = document.createElement("p");
      summary.className = "summary";
      summary.textContent = `${subjects.length} subject${subjects.length === 1 ? "" : "s"} · ${chapterCount} chapter${chapterCount === 1 ? "" : "s"}`;
      detail.appendChild(summary);

      const manageButton = document.createElement("a");
      manageButton.className = "manage-exam-button";
      manageButton.href = `index.html?add-exam=1&edit=${examIndex}`;
      manageButton.textContent = "Add subjects / chapters";
      detail.appendChild(manageButton);

      const removeExamButton = document.createElement("button");
      removeExamButton.className = "remove-exam-button";
      removeExamButton.type = "button";
      removeExamButton.textContent = "Remove exam";
      removeExamButton.addEventListener("click", () => {
        plans.splice(examIndex, 1);
        savePlans();
        window.location.replace("main.html");
      });
      detail.appendChild(removeExamButton);

      const progressStatus = document.createElement("div");
      progressStatus.className = "progress-status";
      progressStatus.innerHTML = '<div class="progress-label"><span>Chapter progress</span><span class="progress-count">0 / 0</span></div><div class="progress-track"><div class="progress-fill"></div></div>';
      detail.appendChild(progressStatus);
      const progressCount = progressStatus.querySelector(".progress-count");
      const progressFill = progressStatus.querySelector(".progress-fill");

      const subjectList = document.createElement("section");
      subjectList.className = "subject-list";
      const updateProgress = () => {
        const completed = subjectList.querySelectorAll("input:checked").length;
        progressCount.textContent = `${completed} / ${chapterCount}`;
        progressFill.style.width = chapterCount ? `${(completed / chapterCount) * 100}%` : "0%";
      };
      subjects.forEach((subject, subjectIndex) => {
        const subjectCard = document.createElement("article");
        subjectCard.className = "subject-card";
        const subjectHeading = document.createElement("div");
        subjectHeading.className = "subject-heading";
        const subjectTitle = document.createElement("h2");
        subjectTitle.textContent = subject.name || "Untitled subject";
        const removeSubjectButton = document.createElement("button");
        removeSubjectButton.className = "remove-subject-button";
        removeSubjectButton.type = "button";
        removeSubjectButton.textContent = "Remove";
        removeSubjectButton.setAttribute("aria-label", `Remove ${subject.name || "subject"}`);
        removeSubjectButton.addEventListener("click", () => {
          plan.subjects.splice(subjectIndex, 1);
          savePlans();
          window.location.reload();
        });
        subjectHeading.append(subjectTitle, removeSubjectButton);
        subjectCard.appendChild(subjectHeading);

        const chapters = Array.isArray(subject.chapters) ? subject.chapters : [];
        if (!chapters.length) {
          const emptyText = document.createElement("p");
          emptyText.className = "empty-state";
          emptyText.textContent = "No chapters added yet.";
          subjectCard.appendChild(emptyText);
        } else {
          const chapterList = document.createElement("div");
          chapterList.className = "chapter-list";
          chapters.forEach((rawChapter, chapterIndex) => {
            const chapter = normalizeChapter(rawChapter);
            subject.chapters[chapterIndex] = chapter;
            const label = document.createElement("label");
            label.className = "chapter-item";
            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.addEventListener("change", updateProgress);
            const chapterText = document.createElement("span");
            chapterText.className = "chapter-name";
            chapterText.textContent = chapter.name;
            const chapterInfo = document.createElement("span");
            chapterInfo.className = "chapter-info";
            const noteList = document.createElement("span");
            noteList.className = "chapter-notes";
            chapter.notes.forEach((note) => {
              const badge = document.createElement("span");
              badge.className = "chapter-note-badge";
              badge.textContent = note;
              const clearNote = document.createElement("button");
              clearNote.type = "button";
              clearNote.className = "clear-note-button";
              clearNote.textContent = "×";
              clearNote.setAttribute("aria-label", `Remove ${note} from ${chapter.name}`);
              clearNote.addEventListener("click", (event) => {
                event.preventDefault();
                event.stopPropagation();
                chapter.notes = chapter.notes.filter((item) => item !== note);
                savePlans();
                window.location.reload();
              });
              badge.appendChild(clearNote);
              noteList.appendChild(badge);
            });
            const addNoteButton = document.createElement("button");
            addNoteButton.type = "button";
            addNoteButton.className = "add-note-button";
            addNoteButton.textContent = chapter.notes.length ? "Edit notes" : "Add note";
            addNoteButton.addEventListener("click", (event) => {
              event.preventDefault();
              event.stopPropagation();
              showNoteModal(chapter);
            });
            const removeChapterButton = document.createElement("button");
            removeChapterButton.className = "remove-chapter-button";
            removeChapterButton.type = "button";
            removeChapterButton.textContent = "×";
            removeChapterButton.setAttribute("aria-label", `Remove ${chapter.name}`);
            removeChapterButton.addEventListener("click", (event) => {
              event.preventDefault();
              event.stopPropagation();
              subject.chapters.splice(chapterIndex, 1);
              savePlans();
              window.location.reload();
            });
            chapterInfo.append(chapterText, noteList);
            label.append(checkbox, chapterInfo, addNoteButton, removeChapterButton);
            chapterList.appendChild(label);
          });
          subjectCard.appendChild(chapterList);
        }
        subjectList.appendChild(subjectCard);
      });
      detail.appendChild(subjectList);
      updateProgress();
    }
  </script>
  <script src="/install.js" defer></script>
</body>
</html>
