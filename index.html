

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#111426" />
  <meta name="description" content="A personal task space by Preet" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Nudge" />
  <title>Nudge</title>

  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="/nudge-icon-192.png" />
  <link rel="apple-touch-icon" href="/nudge-icon-192.png" />
  <link rel="stylesheet" href="/style.css" />

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    .app-background {
      position: fixed;
      inset: 0;
      z-index: -2;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .nudge-study-screen {
      display: grid;
      position: fixed;
      inset: 0;
      padding: max(14px, env(safe-area-inset-top)) 18px
        max(14px, env(safe-area-inset-bottom));
      place-items: center;
    }

    .nudge-study-card {
      position: relative;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      width: min(100%, 420px);
      max-height: calc(100dvh - 28px);
      padding: clamp(18px, 5vw, 28px);
      box-sizing: border-box;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      background: rgba(22, 27, 58, 0.58);
      box-shadow:
        0 14px 34px rgba(7, 5, 22, 0.34),
        inset 0 1px rgba(255, 255, 255, 0.12);
      color: white;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .nudge-study-card::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 10px -4px -8px;
      border-radius: inherit;
      background: linear-gradient(110deg, rgba(234, 72, 151, .32), rgba(144, 113, 255, .24) 48%, rgba(61, 185, 222, .3));
      filter: blur(20px);
      opacity: .68;
    }


    .form-back-link {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 14px;
      padding: 7px 11px;
      border: 1px solid rgba(255,255,255,.24);
      border-radius: 999px;
      background: rgba(8,10,23,.28);
      color: rgba(255,255,255,.84);
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: inset 0 1px rgba(255,255,255,.1);
      transition: transform 160ms ease, color 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .form-back-link::before { content: "←"; color: #c9c1ff; font-size: 15px; line-height: 1; }
    .form-back-link:hover, .form-back-link:focus-visible { transform: translateX(-2px); border-color: rgba(185,173,255,.62); background: rgba(144,113,255,.18); color: #fff; }

    .nudge-study-card h1 {
      margin: 0 0 5px;
      font-size: clamp(23px, 7vw, 32px);
      line-height: 1.1;
      background: linear-gradient(110deg, #f09ac8, #b9adff 52%, #a9d9e8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .nudge-study-card > p {
      margin: 0 0 13px;
      color: rgba(255, 255, 255, 0.614);
      font-size: 10px;
      line-height: 1.4;
    }

    .nudge-study-form {
      display: grid;
      gap: 7px;
      min-height: 0;
    }

    .nudge-study-form label {
      margin-top: 3px;
      color: rgba(255, 255, 255, 0.78);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .nudge-study-form input {
      width: 100%;
      padding: 11px 12px;
      box-sizing: border-box;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 12px;
      outline: none;
      background: rgba(5, 7, 17, 0.34);
      color: white;
      font: inherit;
      box-shadow: inset 0 1px rgba(255, 255, 255, .05);
      transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    .nudge-study-form input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .nudge-study-form input:focus {
      border-color: rgba(185, 173, 255, .72);
      background: rgba(5, 7, 17, .46);
      box-shadow: 0 0 0 3px rgba(154, 148, 255, 0.14), inset 0 1px rgba(255, 255, 255, .08);
    }

    .field-with-button {
      display: flex;
      gap: 8px;
    }

    .field-with-button input {
      flex: 1;
      min-width: 0;
    }

    .add-button {
      flex-shrink: 0;
      padding: 0 14px;
      border: 0;
      border-radius: 13px;
      background: linear-gradient(110deg, rgba(234, 72, 151, .42), rgba(144, 113, 255, .34) 48%, rgba(61, 185, 222, .42));
      color: white;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 5px 14px rgba(7, 5, 22, .2), inset 0 1px rgba(255, 255, 255, .14);
      transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
    }

    .add-button:hover:not(:disabled),
    .add-button:focus-visible:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(144, 113, 255, .28);
      filter: brightness(1.12);
    }

    .add-button:active:not(:disabled) {
      transform: scale(.98);
    }

    .add-button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .active-subject-text {
      min-height: 16px;
      margin: 0;
      color: #c5c2ff;
      font-size: 12px;
    }

    .subject-plan-list {
      display: grid;
      gap: 7px;
      max-height: 150px;
      padding-right: 3px;
      overflow-y: auto;
      -ms-overflow-style: none;
      overscroll-behavior: contain;
      scroll-behavior: smooth;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .subject-plan-list::-webkit-scrollbar {
      display: none;
    }

    .subject-item {
      padding: 9px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 13px;
      background: rgba(5, 7, 17, 0.24);
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .subject-item.active {
      border-color: rgba(185, 173, 255, .6);
      background: linear-gradient(110deg, rgba(234,72,151,.12), rgba(144,113,255,.16) 52%, rgba(61,185,222,.12));
      transform: translateY(-1px);
    }

    .subject-item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .subject-title {
      overflow: hidden;
      font-size: 13px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .remove-button {
      flex-shrink: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: rgba(255, 255, 255, 0.7);
      cursor: pointer;
      font-size: 17px;
      line-height: 1;
    }

    .chapter-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 7px;
    }

    .chapter-chip {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 7px;
      border-radius: 999px;
      background: rgba(185, 173, 255, 0.14);
      color: rgba(255, 255, 255, .82);
      font-size: 11px;
    }

    .chapter-chip button {
      padding: 0;
      border: 0;
      background: transparent;
      color: white;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
    }

    .empty-chapter-text {
      margin-top: 7px;
      color: rgba(255, 255, 255, 0.48);
      font-size: 11px;
    }

    .form-message {
      min-height: 16px;
      margin: 0;
      color: #ffb2b2;
      font-size: 12px;
    }

    .create-plan-button {
      margin-top: 2px;
      padding: 12px;
      border: 0;
      border-radius: 13px;
      background: linear-gradient(110deg, rgba(234, 72, 151, .42), rgba(144, 113, 255, .34) 48%, rgba(61, 185, 222, .42));
      color: white;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      box-shadow: 0 7px 18px rgba(7, 5, 22, .22), inset 0 1px rgba(255, 255, 255, .14);
      transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
    }

    .create-plan-button:hover,
    .create-plan-button:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(144, 113, 255, .28);
      filter: brightness(1.12);
    }

    .create-plan-button:active {
      transform: scale(.98);
    }

    @media (max-height: 690px) {
      .nudge-study-card {
        padding: 15px 18px;
      }

      .nudge-study-card h1 {
        font-size: 23px;
      }

      .nudge-study-card > p {
        margin-bottom: 7px;
      }

      .nudge-study-form {
        gap: 5px;
      }

      .nudge-study-form input {
        padding: 8px 10px;
      }

      .subject-plan-list {
        max-height: 110px;
      }
    }
  </style>
</head>

<body>
  <img src="/nudge-logo.svg" alt="Nudge — made by Preet" class="nudge-logo" />
  <img src="/bg.jpg" alt="App background" class="app-background" />

  <main class="nudge-study-screen">
    <section class="nudge-study-card">
      <a class="form-back-link" id="form-back-link" href="main.html" hidden>Back</a>
      <h1>Create your study plan</h1>
      <p>Add each subject and its chapters before creating your plan.</p>

      <form class="nudge-study-form" id="study-form">
        <label for="student-name">Your name</label>
        <input
          id="student-name"
          type="text"
          placeholder="Enter your name"
          autocomplete="name"
        />

        <label for="exam-name">Exam name</label>
        <input
          id="exam-name"
          type="text"
          placeholder="Example: JEE Main 2026"
        />

        <label for="subject-name">Subject</label>
        <div class="field-with-button">
          <input
            id="subject-name"
            type="text"
            placeholder="Example: Physics"
          />
          <button id="add-subject-button" class="add-button" type="button">
            Add Subject
          </button>
        </div>

        <p id="active-subject-text" class="active-subject-text">
          Add a subject first, then add its chapters.
        </p>

        <label for="chapter-name">Chapter</label>
        <div class="field-with-button">
          <input
            id="chapter-name"
            type="text"
            placeholder="Example: Kinematics"
            disabled
          />
          <button
            id="add-chapter-button"
            class="add-button"
            type="button"
            disabled
          >
            Add Chapter
          </button>
        </div>

        <div id="subject-plan-list" class="subject-plan-list"></div>
        <p id="form-message" class="form-message"></p>

        <button class="create-plan-button" type="submit">
           Get started 
        </button>
      </form>
    </section>
  </main>

  
  <script>
    const STUDY_PLAN_STORAGE_KEY = "nudge-study-plan";
    const STUDY_PLANS_STORAGE_KEY = "nudge-study-plans";
    const queryParams = new URLSearchParams(window.location.search);
    const isAddingExam = queryParams.has("add-exam");
    const editExamIndex = Number.parseInt(queryParams.get("edit"), 10);
    const isEditingExam = Number.isInteger(editExamIndex) && editExamIndex >= 0;

    try {
      if (!isAddingExam && (localStorage.getItem(STUDY_PLANS_STORAGE_KEY) || localStorage.getItem(STUDY_PLAN_STORAGE_KEY))) {
        window.location.replace("/main.html");
      }
    } catch (error) {
      console.warn("Unable to read the saved study plan.", error);
    }

    const studyForm = document.getElementById("study-form");
    const subjectInput = document.getElementById("subject-name");
    const chapterInput = document.getElementById("chapter-name");
    const addSubjectButton = document.getElementById("add-subject-button");
    const addChapterButton = document.getElementById("add-chapter-button");
    const subjectPlanList = document.getElementById("subject-plan-list");
    const activeSubjectText = document.getElementById("active-subject-text");
    const formMessage = document.getElementById("form-message");
    const studentNameInput = document.getElementById("student-name");
    const examNameInput = document.getElementById("exam-name");

    function getSavedStudentName() {
      try {
        const savedPlans = JSON.parse(localStorage.getItem(STUDY_PLANS_STORAGE_KEY) || "[]");
        const plans = Array.isArray(savedPlans) ? savedPlans : [];
        const legacyPlan = JSON.parse(localStorage.getItem(STUDY_PLAN_STORAGE_KEY) || "null");
        const allPlans = plans.length ? plans : (legacyPlan ? [legacyPlan] : []);
        return allPlans.find((plan) => plan?.studentName)?.studentName || "";
      } catch (error) {
        return "";
      }
    }

    function getEditablePlan() {
      try {
        const savedPlans = JSON.parse(localStorage.getItem(STUDY_PLANS_STORAGE_KEY) || "[]");
        return Array.isArray(savedPlans) ? savedPlans[editExamIndex] : null;
      } catch (error) {
        return null;
      }
    }

    const savedStudentName = getSavedStudentName();
    document.getElementById("form-back-link").hidden = !isEditingExam;
    if (savedStudentName) {
      studentNameInput.value = savedStudentName;
      studentNameInput.hidden = true;
      document.querySelector('label[for="student-name"]').hidden = true;
    }

    if (isEditingExam) {
      examNameInput.hidden = true;
      document.querySelector('label[for="exam-name"]').hidden = true;
    }

    const studySubjects = [];
    let activeSubjectIndex = -1;

    function updateActiveSubject() {
      const hasActiveSubject = activeSubjectIndex >= 0;

      chapterInput.disabled = !hasActiveSubject;
      addChapterButton.disabled = !hasActiveSubject;

      if (hasActiveSubject) {
        activeSubjectText.textContent =
          `Adding chapters to: ${studySubjects[activeSubjectIndex].name}`;
      } else {
        activeSubjectText.textContent =
          "Add a subject first, then add its chapters.";
      }
    }

    function selectSubject(index) {
      activeSubjectIndex = index;
      formMessage.textContent = "";
      updateActiveSubject();
      renderSubjects();
      chapterInput.focus();
    }

    function renderSubjects() {
      subjectPlanList.innerHTML = "";

      studySubjects.forEach((subject, subjectIndex) => {
        const subjectItem = document.createElement("div");
        subjectItem.className = "subject-item";

        if (subjectIndex === activeSubjectIndex) {
          subjectItem.classList.add("active");
        }

        const topRow = document.createElement("div");
        topRow.className = "subject-item-top";

        const title = document.createElement("span");
        title.className = "subject-title";
        title.textContent = subject.name;

        const removeSubject = document.createElement("button");
        removeSubject.className = "remove-button";
        removeSubject.type = "button";
        removeSubject.textContent = "×";
        removeSubject.setAttribute("aria-label", `Remove ${subject.name}`);

        removeSubject.addEventListener("click", (event) => {
          event.stopPropagation();

          studySubjects.splice(subjectIndex, 1);

          if (studySubjects.length === 0) {
            activeSubjectIndex = -1;
          } else if (activeSubjectIndex >= studySubjects.length) {
            activeSubjectIndex = studySubjects.length - 1;
          }

          updateActiveSubject();
          renderSubjects();
        });

        topRow.append(title, removeSubject);
        subjectItem.appendChild(topRow);

        if (subject.chapters.length === 0) {
          const emptyText = document.createElement("div");
          emptyText.className = "empty-chapter-text";
          emptyText.textContent = "No chapters added yet.";
          subjectItem.appendChild(emptyText);
        } else {
          const chapterList = document.createElement("div");
          chapterList.className = "chapter-list";

          subject.chapters.forEach((chapter, chapterIndex) => {
            const chapterChip = document.createElement("div");
            chapterChip.className = "chapter-chip";

            const chapterText = document.createElement("span");
            chapterText.textContent = chapter;

            const removeChapter = document.createElement("button");
            removeChapter.type = "button";
            removeChapter.textContent = "×";
            removeChapter.setAttribute("aria-label", `Remove ${chapter}`);

            removeChapter.addEventListener("click", (event) => {
              event.stopPropagation();
              subject.chapters.splice(chapterIndex, 1);
              renderSubjects();
            });

            chapterChip.append(chapterText, removeChapter);
            chapterList.appendChild(chapterChip);
          });

          subjectItem.appendChild(chapterList);
        }

        subjectItem.addEventListener("click", () => selectSubject(subjectIndex));
        subjectPlanList.appendChild(subjectItem);
      });
    }

    if (isEditingExam) {
      const editablePlan = getEditablePlan();
      if (editablePlan) {
        document.getElementById("exam-name").value = editablePlan.examName || "";
        const editableSubjects = Array.isArray(editablePlan.subjects) ? editablePlan.subjects : [];
        editableSubjects.forEach((subject) => {
          studySubjects.push({
            name: subject.name,
            chapters: Array.isArray(subject.chapters) ? [...subject.chapters] : []
          });
        });
        activeSubjectIndex = studySubjects.length ? studySubjects.length - 1 : -1;
        updateActiveSubject();
        renderSubjects();
      }
    }

    function addSubject() {
      const subjectName = subjectInput.value.trim();

      if (!subjectName) {
        formMessage.textContent = "Enter a subject name first.";
        subjectInput.focus();
        return;
      }

      const isDuplicate = studySubjects.some(
        (subject) => subject.name.toLowerCase() === subjectName.toLowerCase()
      );

      if (isDuplicate) {
        formMessage.textContent = "This subject is already added.";
        return;
      }

      studySubjects.push({
        name: subjectName,
        chapters: []
      });

      activeSubjectIndex = studySubjects.length - 1;
      subjectInput.value = "";
      formMessage.textContent = "";

      updateActiveSubject();
      renderSubjects();
      chapterInput.focus();
    }

    function addChapter() {
      const chapterName = chapterInput.value.trim();

      if (activeSubjectIndex === -1) {
        formMessage.textContent = "Add a subject before adding a chapter.";
        return;
      }

      if (!chapterName) {
        formMessage.textContent = "Enter a chapter name first.";
        chapterInput.focus();
        return;
      }

      const activeSubject = studySubjects[activeSubjectIndex];

      const isDuplicate = activeSubject.chapters.some(
        (chapter) => chapter.toLowerCase() === chapterName.toLowerCase()
      );

      if (isDuplicate) {
        formMessage.textContent = "This chapter is already added.";
        return;
      }

      activeSubject.chapters.push(chapterName);
      chapterInput.value = "";
      formMessage.textContent = "";
      renderSubjects();
      chapterInput.focus();
    }

    addSubjectButton.addEventListener("click", addSubject);
    addChapterButton.addEventListener("click", addChapter);

    subjectInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        addSubject();
      }
    });

    chapterInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        addChapter();
      }
    });

    studyForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const studentName = document.getElementById("student-name").value.trim();
      const examName = document.getElementById("exam-name").value.trim();

      if (!studentName || !examName) {
        formMessage.textContent = "Enter your name and exam name first.";
        return;
      }

      if (studySubjects.length === 0) {
        formMessage.textContent = "Add at least one subject first.";
        return;
      }

      const subjectWithoutChapters = studySubjects.find(
        (subject) => subject.chapters.length === 0
      );

      if (subjectWithoutChapters) {
        formMessage.textContent =
          `Add at least one chapter for ${subjectWithoutChapters.name}.`;
        return;
      }

      const studyPlan = {
        studentName,
        examName,
        subjects: studySubjects
      };

      try {
        const savedPlans = JSON.parse(localStorage.getItem(STUDY_PLANS_STORAGE_KEY) || "[]");
        const existingPlans = Array.isArray(savedPlans) ? savedPlans : [];

        if (existingPlans.length === 0) {
          const legacyPlan = localStorage.getItem(STUDY_PLAN_STORAGE_KEY);
          if (legacyPlan) existingPlans.push(JSON.parse(legacyPlan));
        }

        if (isEditingExam && existingPlans[editExamIndex]) {
          existingPlans[editExamIndex] = studyPlan;
        } else {
          existingPlans.push(studyPlan);
        }
        localStorage.setItem(STUDY_PLANS_STORAGE_KEY, JSON.stringify(existingPlans));
        localStorage.removeItem(STUDY_PLAN_STORAGE_KEY);
        window.location.replace("/main.html");
      } catch (error) {
        formMessage.textContent = "We couldn't save your plan. Please try again.";
        console.error("Unable to save the study plan.", error);
      }
    });

    updateActiveSubject();
  </script>

  <script src="/app.js" defer></script>
  <script src="/install.js" defer></script>
</body>
</html>
