
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111426" />
  <meta name="description" content="A personal task space by Preet" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Nudge" />
  <title>Nudge</title>

  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="/nudge-icon-192.png" />
  <link rel="apple-touch-icon" href="/nudge-icon-192.png" />
  <link rel="stylesheet" href="/style.css" />

  <style>
    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
      overflow-y: auto;
    }

    .app-background {
      position: fixed;
      inset: 0;
      z-index: -2;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .nudge-study-screen {
      display: grid;
      position: relative;
      min-height: 100dvh;
      padding: max(24px, env(safe-area-inset-top)) 24px
        max(24px, env(safe-area-inset-bottom));
      place-items: center;
    }

    .nudge-study-card {
      box-sizing: border-box;
      width: min(100%, 412px);
      padding: 28px 24px;
      border: 1px solid rgba(255, 255, 255, 0.27);
      border-radius: 26px;
      background: rgba(17, 20, 38, 0.48);
      box-shadow:
        0 18px 55px rgba(0, 0, 0, 0.38),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);
      color: white;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .nudge-study-card h1 {
      margin: 0 0 6px;
      font-size: clamp(25px, 7vw, 34px);
      line-height: 1.1;
    }

    .nudge-study-card p {
      margin: 0 0 16px;
      color: rgba(255, 255, 255, 0.72);
      font-size: 14px;
      line-height: 1.4;
    }

    .nudge-study-form {
      display: grid;
      gap: 8px;
    }

    .nudge-study-form label {
      margin-top: 4px;
      color: rgba(255, 255, 255, 0.9);
      font-size: 13px;
      font-weight: 600;
    }

    .nudge-study-form input,
    .nudge-study-form textarea {
      box-sizing: border-box;
      width: 100%;
      padding: 12px 13px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      outline: none;
      background: rgba(0, 0, 0, 0.2);
      color: white;
      font: inherit;
    }

    .chapter-entry-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .chapter-entry-row button {
      margin: 0;
      padding: 0 15px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: rgba(255, 255, 255, 0.12);
      color: white;
    }

    .chapter-list {
      display: grid;
      gap: 8px;
      min-height: 0;
      margin-top: 2px;
    }

    .subject-list {
      display: grid;
      gap: 12px;
    }

    .subject-card {
      display: grid;
      gap: 8px;
      padding: 14px;
      border: 1px solid rgba(214, 207, 255, 0.28);
      border-radius: 16px;
      background: rgba(8, 10, 28, 0.24);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .subject-card h2 {
      margin: 0 0 2px;
      color: white;
      font-size: 16px;
      line-height: 1.25;
    }

    .subject-card > label {
      margin-top: 0;
    }

    .chapter-item {
      display: flex;
      align-items: center;
      gap: 11px;
      box-sizing: border-box;
      width: 100%;
      padding: 12px 13px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.2);
      color: rgba(255, 255, 255, 0.9);
      font-size: 14px;
    }

    .chapter-item input {
      box-sizing: border-box;
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: #9c95ff;
    }

    .nudge-study-form input::placeholder,
    .nudge-study-form textarea::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .nudge-study-form input:focus,
    .nudge-study-form textarea:focus {
      border-color: #aaa6ff;
      box-shadow: 0 0 0 3px rgba(154, 148, 255, 0.24);
    }

    .nudge-study-form textarea {
      min-height: 70px;
      resize: none;
    }

    .nudge-study-form button {
      box-sizing: border-box;
      margin-top: 8px;
      padding: 13px;
      border: 1px solid rgba(214, 207, 255, 0.42);
      border-radius: 12px;
      background: linear-gradient(
        120deg,
        rgba(116, 111, 221, 0.52),
        rgba(201, 119, 208, 0.4)
      );
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.26),
        0 8px 20px rgba(8, 9, 28, 0.2);
      color: white;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: transform 160ms ease, background 160ms ease;
    }

    .nudge-study-form button:hover {
      background: linear-gradient(
        120deg,
        rgba(137, 132, 243, 0.62),
        rgba(221, 135, 225, 0.5)
      );
      transform: translateY(-1px);
    }

    .chapter-entry-row button {
      margin: 0;
      padding: 0 15px;
    }

    @media (max-height: 680px) {
      .nudge-study-card {
        padding: 16px 20px;
      }

      .nudge-study-card h1 {
        font-size: 25px;
      }

      .nudge-study-card p {
        margin-bottom: 8px;
      }

      .nudge-study-form input,
      .nudge-study-form textarea {
        padding: 9px 11px;
      }

      .nudge-study-screen { padding: 16px 20px; }
    }
  </style>
</head>

<body>
  <img src="/nudge-logo.svg" alt="Nudge — made by Preet" class="nudge-logo" />
  <img src="/bg.jpg" alt="App background" class="app-background" />

  <main class="nudge-study-screen">
    <section class="nudge-study-card">
      <h1>Create your study plan</h1>
      <p>Enter your exam details and subjects to get started.</p>

      <form class="nudge-study-form">
        <label for="student-name">Your name</label>
        <input
          id="student-name"
          type="text"
          placeholder="Enter your name"
          autocomplete="name"
        />

        <label for="exam-name">Exam name</label>
        <input
          id="exam-name"
          type="text"
          placeholder="Example: JEE Main 2026"
        />

        <label for="subject-entry" id="subject-entry-label">Add a subject</label>
        <div class="chapter-entry-row">
          <input
            id="subject-entry"
            type="text"
            placeholder="Example: Physics"
            autocomplete="off"
          />
          <button type="button" id="add-subject">Add</button>
        </div>
        <div class="subject-list" id="subject-list" aria-live="polite"></div>

        <button type="submit">Create Plan →</button>
      </form>
    </section>
  </main>

  

  <script src="/app.js?v=5" defer></script>
</body>
</html>
