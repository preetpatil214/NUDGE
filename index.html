<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111426" />
  <meta name="description" content="A personal task space by Preet" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Nudge" />
  <title>Nudge</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <img src="bg.jpg" alt="" class="app-background" aria-hidden="true" />

  <main class="page-shell">
    <section class="setup-card" aria-labelledby="setup-title">
      <span class="eyebrow">Study planner</span>
      <h1 id="setup-title">Set up your next nudge.</h1>

      <p class="intro">
        Tell Nudge what you are working toward and turn your syllabus into focused steps.
      </p>

      <form class="study-form">
        <label for="name">Your name</label>
        <input
          id="name"
          name="name"
          type="text"
          placeholder="Enter your name"
          autocomplete="name"
        />

        <label for="exam">Exam name</label>
        <input
          id="exam"
          name="exam"
          type="text"
          placeholder="e.g. JEE Main 2026"
        />

        <label for="subject">Subject</label>
        <input
          id="subject"
          name="subject"
          type="text"
          placeholder="e.g. Physics"
        />

        <label for="chapters">
          Chapters <span>for this subject</span>
        </label>
        <textarea
          id="chapters"
          name="chapters"
          rows="4"
          placeholder="e.g. Kinematics, Laws of Motion, Work & Energy"
        ></textarea>

        <button type="submit">
          Create my study plan <span aria-hidden="true">→</span>
        </button>
      </form>
    </section>
  </main>
</body>
</html>
